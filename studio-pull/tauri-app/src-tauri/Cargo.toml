[package]
name = "studio-console"
version = "0.1.0"
description = "Studio Console — local Pull + Tokens"
authors = ["studio"]
edition = "2021"

[lib]
name = "studio_console_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
